<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sequoia Idle – Proto A (Quaternius 3D)</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#bfe3f0;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#fffaefe6;border-radius:16px;padding:8px 18px;display:flex;gap:18px;align-items:baseline;box-shadow:0 3px 12px #0002;color:#2f4a2a}
#hud b{font-size:24px}#hud span{font-size:13px;opacity:.75}
#shop{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;max-width:98vw;overflow-x:auto;padding:4px}
#shop button{min-width:118px;border:0;border-radius:14px;background:#fffaef;padding:8px 10px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 6px;box-shadow:0 3px 10px #0003;cursor:pointer;color:#2f4a2a;font:inherit}
#shop button b{font-size:13px}#shop small{grid-column:1/3;font-size:11px;opacity:.7}#shop .c{grid-column:1/3;font-weight:700;color:#3d7d33;font-size:13px}#shop .n{font-size:12px;opacity:.7}
#shop button:disabled{opacity:.5}#shop button.sel{outline:3px solid #f2b33d}#shop button.up{background:#f5ecd6}
#hint{position:fixed;top:64px;left:50%;transform:translateX(-50%);font-size:12px;color:#2f4a2a;background:#fff8;padding:3px 10px;border-radius:10px;white-space:nowrap}
#toast{position:fixed;top:96px;left:50%;transform:translateX(-50%);background:#2f4a2acc;color:#fff;padding:6px 14px;border-radius:12px;opacity:0;transition:opacity .3s;pointer-events:none}
.float{position:fixed;pointer-events:none;color:#fff;font-weight:700;text-shadow:0 1px 3px #0008;animation:fl .9s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes fl{to{margin-top:-50px;opacity:0}}
#load{position:fixed;inset:0;display:grid;place-items:center;font-size:20px;color:#2f4a2a}
#credit{position:fixed;right:8px;bottom:96px;font-size:10px;color:#2f4a2a99}#credit a{color:inherit}
@media(max-width:600px){#hud{gap:10px;padding:6px 12px}#hint{font-size:10px;top:76px}}</style></head><body>
<div id="hud"><div><b id="o2">0</b> <span>O₂</span></div><div><span>rate</span> <b id="rate" style="font-size:16px">0/s</b></div><div><span>green</span> <b id="gp" style="font-size:16px">0%</b></div></div>
<div id="hint"></div><div id="toast"></div><div id="shop"></div><div id="load">Loading…</div>
<div id="credit">Prototype A · 3D models by <a href="https://quaternius.com" target="_blank">Quaternius</a> (CC0) · <a href="CREDITS.md" target="_blank">credits</a></div>
<script src="main.js"></script></body></html>
