<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14331f">
<link rel="icon" href="data:,">
<title>Sequoia Idle v0.3 (prototype)</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0e1a12;color:#eef3ea;font:14px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
#stage{position:relative;flex:1 1 auto;min-height:0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer;touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;padding:8px 10px 18px;padding-top:max(8px,env(safe-area-inset-top));pointer-events:none;text-shadow:0 1px 3px #0009;text-align:center}
#hud .row{display:flex;justify-content:space-between;gap:6px;font-size:12px;opacity:.95}
#o2{font-size:32px;font-weight:900;line-height:1.05;margin-top:2px}
#rate{font-size:14px;font-weight:700;color:#c9f5b0}
#co2{display:flex;align-items:center;gap:6px;margin:6px auto 0;max-width:420px;font-size:11px;font-weight:800}
#co2 .bar{position:relative;flex:1;height:12px;border-radius:6px;background:#0006;overflow:hidden}
#co2f{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#6fcf6a,#e9c64a 50%,#d9573b)}
#co2 .goal{position:absolute;left:0;top:0;bottom:0;width:2px;background:#fff}
#ppm{min-width:64px;text-align:right}
#btns{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
.fb{min-width:44px;height:36px;border-radius:18px;border:1px solid #fff6;background:#1d3324cc;color:#fff;font:700 13px system-ui,sans-serif;padding:0 10px}
.fb.off{opacity:.5;text-decoration:line-through}
#picker{position:absolute;left:6px;bottom:8px;right:64px;display:flex;gap:4px;flex-wrap:nowrap}
.chip{position:relative;flex:0 1 42px;min-width:0;height:42px;border-radius:10px;border:2px solid #ffffff55;background:#1d3324cc;padding:2px;display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.chip canvas{width:30px;height:30px;max-width:100%}
.chip.on{border-color:#ffe066;background:#2f5a38ee;box-shadow:0 0 0 2px #ffe06655}
.chip.locked{opacity:.35;filter:grayscale(1)}
.chip .auto{color:#fff;font:800 11px system-ui,sans-serif}
.badge{position:absolute;top:-6px;right:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#ffe066;color:#1d3324;font:900 10px/16px system-ui,sans-serif;text-align:center}
.badge.free{background:#8fd18f;font-size:8px}
#toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.8);background:#1d3324ee;border:2px solid #ffe066;color:#ffe066;padding:10px 16px;border-radius:14px;font-weight:900;font-size:16px;opacity:0;transition:all .3s;pointer-events:none;text-align:center;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.u canvas{width:36px;height:36px;flex:0 0 36px}
.u .cnt{font-weight:900;color:#ffe08a;margin-right:4px}
.animal{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;background:#203a27;margin-bottom:6px}
#hud{background:linear-gradient(#142819e6,#14281900)}

#year{font-weight:700}
#sap{font-size:16px;font-weight:700}
#rates{font-size:11px;opacity:.9}
#tags{font-size:11px;color:#ffe9a8;min-height:14px}
#panel{flex:0 0 42%;max-height:42%;display:flex;flex-direction:column;background:#15261a;border-top:2px solid #2c4a31;min-height:0}
#tabs{display:flex;flex:0 0 auto}
#tabs button{flex:1;padding:9px 2px;border:0;background:#1b3021;color:#bcd0bd;font:inherit;font-weight:700;font-size:13px;border-bottom:2px solid transparent}
#tabs button.on{color:#fff;border-bottom-color:#8fd18f;background:#20392a}
.view{flex:1 1 auto;overflow-y:auto;padding:8px;display:none;-webkit-overflow-scrolling:touch}
.view.on{display:block}
.u{display:flex;align-items:center;gap:8px;width:100%;text-align:left;margin:0 0 6px;padding:8px;border-radius:8px;border:1px solid #33583a;background:#203a27;color:#eef3ea;font:inherit;touch-action:manipulation}
.u:disabled{opacity:.5}
.u .n{font-weight:700}
.u .d{font-size:11px;opacity:.8}
.u .m{flex:1;min-width:0}
.u .c{font-weight:700;color:#ffe08a;white-space:nowrap;text-align:right;font-size:13px}
.u .k{font-size:10px;padding:1px 5px;border-radius:5px;background:#2f5136;margin-left:4px;font-weight:400}
.lock{opacity:.4;font-size:12px;padding:6px 8px}
.btn{padding:8px 12px;border-radius:8px;border:1px solid #4b7a52;background:#2b4c33;color:#fff;font:inherit;font-weight:700;margin:3px 4px 3px 0;touch-action:manipulation}
.btn.on{background:#5a9a5f}
.seg{display:flex;gap:4px;margin-bottom:8px;align-items:center;flex-wrap:wrap}
textarea{width:100%;height:64px;background:#0f1d13;color:#dfe;border:1px solid #33583a;border-radius:6px;font:11px monospace}
.muted{opacity:.7;font-size:12px}
h3{margin:6px 0;font-size:14px}
label{display:flex;gap:8px;align-items:center;margin:6px 0}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
#modal .box{background:#1b3021;border:2px solid #4b7a52;border-radius:12px;padding:16px;max-width:320px;width:100%;text-align:center}
@media (min-width:900px){
 #app{flex-direction:row}
 #panel{flex:0 0 380px;max-height:none;border-top:0;border-left:2px solid #2c4a31}
 #o2{font-size:40px}
}
@media (max-height:560px) and (max-width:899px){#panel{flex-basis:46%;max-height:46%}#o2{font-size:24px}}
</style>
</head>
<body>
<div id="app">
 <div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud">
   <div class="row"><span id="year">Year 1</span><span id="wx">Day</span></div>
   <div id="o2">0 O₂</div>
   <div id="rate">+0/s</div>
   <div id="co2"><span class="lbl">CO₂</span><div class="bar"><div id="co2f"></div><div class="goal"></div></div><span id="ppm">420</span></div>
   <div id="tags"></div>
  </div>
  <div id="btns"><button id="b-mute" class="fb" aria-label="sound">♪</button><button id="b-zoom" class="fb">Auto</button></div>
  <div id="toast"></div>
  <div id="picker"></div>
 </div>
 <div id="panel">
  <div id="tabs"><button data-t="plants" class="on">Plants</button><button data-t="boosts">Boosts</button><button data-t="animals">Animals</button><button data-t="more">More</button></div>
  <div class="view on" id="v-plants"></div>
  <div class="view" id="v-boosts"></div>
  <div class="view" id="v-animals"></div>
  <div class="view" id="v-more"></div>
 </div>
</div>
<div id="modal"><div class="box"><div id="mtext"></div><button class="btn" id="mok">OK</button></div></div>
<script src="main.js"></script>
</body>
</html>
